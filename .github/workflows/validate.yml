name: Validate recipes

on:
  pull_request:
  push:
    branches-ignore: ["main", "master"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check recipe front matter
        run: |
          pip install pyyaml
          python tools/validate_recipes.py
      - name: Check grocery list builder
        run: python tools/test_grocery.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Jekyll build
        run: bundle exec jekyll build
