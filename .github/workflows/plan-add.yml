name: Add Recipe to Plan

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Recipe slug to add to this week"
        required: true
      day:
        description: "Day of the week (monday–sunday). Leave blank to fill first empty day."
        required: false

jobs:
  plan-add:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      # Each click in the UI starts its own run and runs overlap. Re-apply the change on
      # top of the latest main and retry, so a concurrent push can't drop it.
      - name: Add recipe to current week and push
        run: |
          cat > "$RUNNER_TEMP/apply.py" <<'EOF'
          import yaml, os
          from datetime import date, timedelta
          from pathlib import Path

          slug = os.environ["SLUG"]
          chosen_day = os.environ.get("DAY", "").strip().lower()
          today = date.today()
          monday = today - timedelta(days=today.weekday())
          week_of = str(monday)
          days = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]

          plan_path = Path("_data/meal_plan.yml")
          plan = {}
          if plan_path.exists():
              plan = yaml.safe_load(plan_path.read_text()) or {}

          # Reset if it's a different week
          if plan.get("week_of") != week_of:
              plan = {"week_of": week_of}

          if chosen_day and chosen_day in days:
              plan[chosen_day] = slug
              print(f"Added {slug} to {chosen_day}")
          else:
              # Fill the first empty day
              for day in days:
                  if not plan.get(day):
                      plan[day] = slug
                      print(f"Added {slug} to {day}")
                      break
              else:
                  print("All days already filled — recipe not added")

          plan_path.parent.mkdir(exist_ok=True)
          plan_path.write_text(yaml.dump(plan, default_flow_style=False, sort_keys=False), encoding="utf-8")
          EOF

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python "$RUNNER_TEMP/apply.py"
            git add _data/meal_plan.yml
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Plan: add $SLUG to this week"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (another run pushed first), retrying on the latest main"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Could not push after several attempts"
          exit 1
        env:
          SLUG: ${{ inputs.slug }}
          DAY: ${{ inputs.day }}
          TZ: America/New_York
