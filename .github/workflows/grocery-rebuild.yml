name: Rebuild Grocery List

on:
  workflow_dispatch:

jobs:
  grocery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      # The grocery page also edits this file, so build on top of the latest main and
      # retry if something else pushed first (same approach as the meal plan workflows).
      - name: Build grocery list from meal plan and push
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python tools/grocery.py
            git add _data/grocery_list.yml
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Rebuild grocery list from meal plan"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (another change landed first), retrying on the latest main"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Could not push after several attempts"
          exit 1
