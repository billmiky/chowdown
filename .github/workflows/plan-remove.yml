name: Remove Recipe from Plan

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day to clear (monday–sunday)"
        required: true

jobs:
  plan-remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      # Each click in the UI starts its own run and runs overlap. Re-apply the change on
      # top of the latest main and retry, so a concurrent push can't drop it.
      - name: Clear day from meal plan and push
        run: |
          cat > "$RUNNER_TEMP/apply.py" <<'EOF'
          import yaml, os
          from pathlib import Path

          day = os.environ["DAY"].strip().lower()
          valid = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]
          if day not in valid:
              print(f"ERROR: invalid day '{day}'")
              raise SystemExit(1)

          plan_path = Path("_data/meal_plan.yml")
          plan = {}
          if plan_path.exists():
              plan = yaml.safe_load(plan_path.read_text()) or {}

          plan[day] = ""
          plan_path.write_text(yaml.dump(plan, default_flow_style=False, sort_keys=False), encoding="utf-8")
          print(f"Cleared {day} from meal plan")
          EOF

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python "$RUNNER_TEMP/apply.py"
            git add _data/meal_plan.yml
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Plan: remove $DAY"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (another run pushed first), retrying on the latest main"
            sleep $((RANDOM % 5 + 2))
          done
          echo "Could not push after several attempts"
          exit 1
        env:
          DAY: ${{ inputs.day }}
